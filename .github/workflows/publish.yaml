name: Publish chart

on:
  workflow_dispatch:
    inputs:
      version:
        description: Upstream release version, for example v1.6.0
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: Upstream release version, for example v1.6.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Check whether chart version already exists
        id: existing
        env:
          CHART_VERSION: ${{ inputs.version }}
        run: |
          chart_version=${CHART_VERSION#v}
          if helm show chart "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/gateway-api-inference-extension-crds" --version "${chart_version}" >/dev/null 2>&1; then
            echo "exists=true" >>"${GITHUB_OUTPUT}"
            echo "Chart ${chart_version} is already published"
          else
            echo "exists=false" >>"${GITHUB_OUTPUT}"
          fi

      - name: Build chart
        if: steps.existing.outputs.exists != 'true'
        env:
          UPSTREAM_VERSION: ${{ inputs.version }}
        run: scripts/build-chart.sh "${UPSTREAM_VERSION}"

      - name: Publish chart
        if: steps.existing.outputs.exists != 'true'
        run: helm push dist/*.tgz "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
