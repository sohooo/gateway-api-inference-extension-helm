name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.4

      - name: Check shell scripts
        run: shellcheck scripts/*.sh

      - name: Build chart
        run: scripts/build-chart.sh v1.6.0

      - name: Create test cluster
        uses: helm/kind-action@v1

      - name: Validate rendered CRDs against Kubernetes
        run: |
          helm template validation dist/gateway-api-inference-extension-crds-1.6.0.tgz |
            kubectl apply --server-side --dry-run=server -f -

      - name: Upload chart package
        uses: actions/upload-artifact@v4
        with:
          name: gateway-api-inference-extension-crds-1.6.0
          path: dist/*.tgz
