name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Check shell scripts
        run: shellcheck scripts/*.sh

      - name: Build chart
        run: scripts/build-chart.sh v1.6.0

      - name: Create test cluster
        uses: helm/kind-action@v1

      - name: Install chart
        run: helm install inference-extension-crds dist/gateway-api-inference-extension-crds-1.6.0.tgz

      - name: Verify CRDs
        run: |
          kubectl get crd inferencepoolimports.inference.networking.x-k8s.io
          kubectl get crd inferencepools.inference.networking.x-k8s.io

      - name: Verify uninstall retains CRDs
        run: |
          helm uninstall inference-extension-crds
          kubectl get crd inferencepoolimports.inference.networking.x-k8s.io
          kubectl get crd inferencepools.inference.networking.x-k8s.io

      - name: Upload chart package
        uses: actions/upload-artifact@v4
        with:
          name: gateway-api-inference-extension-crds-1.6.0
          path: dist/*.tgz
